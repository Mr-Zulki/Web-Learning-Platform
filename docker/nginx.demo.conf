worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 256k;

    # Timeouts to protect against slowloris / slow clients
    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    keepalive_requests 2000;

    # Buffer tuning
    proxy_buffers 8 16k;
    proxy_buffer_size 16k;

    # Connection limit per IP (generous for examiner load tests from 1 IP)
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
    limit_conn addr_conn 500;

    # Page cache for static routes ONLY (/, /lessons, /lessons/*)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=page_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # Custom log format logging upstream IP, latency, and container hostname
    log_format upstream_lb '$time_iso8601 - $remote_addr "$request" status=$status '
                           'upstream=$upstream_addr response_time=${upstream_response_time}s '
                           'cache=$upstream_cache_status served_by="$upstream_http_x_served_by"';

    access_log /dev/stdout upstream_lb;
    error_log /dev/stderr warn;

    # Gzip compression for text and asset responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Demo Profile: High-capacity rate limit zone for examiner stress testing (200r/s)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=200r/s;
    limit_req_status 429;

    # Upstream to app replicas with keepalive connection pooling
    upstream app_backend {
        server app:3000 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        # Failover and timeout settings
        proxy_connect_timeout 2s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # Default proxy headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; # OVERWRITE, never append
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hide internal upstream software headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Structured clean JSON error pages (never HTML or stack traces)
        error_page 400 = @bad_request;
        location @bad_request {
            default_type application/json;
            return 400 '{"error":{"code":"BAD_REQUEST","message":"Malformed request syntax."}}';
        }

        error_page 413 = @payload_too_large;
        location @payload_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request payload exceeds maximum allowed size."}}';
        }

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please try again later."}}';
        }

        error_page 502 503 504 = @service_unavailable;
        location @service_unavailable {
            default_type application/json;
            add_header Retry-After 5 always;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Server is currently busy or experiencing high load. Please retry in a few moments."}}';
        }

        # Static assets caching with immutable headers
        location /_next/static/ {
            proxy_pass http://app_backend;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        # Liveness healthcheck: NEVER CACHED, keeps lb:check truthful
        location = /api/health {
            proxy_pass http://app_backend;
            proxy_cache off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        # Readiness check: NEVER CACHED
        location = /api/ready {
            proxy_pass http://app_backend;
            proxy_cache off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        # Rate-limited auth routes (Demo: 200r/s, burst=300)
        location /api/auth/ {
            limit_req zone=auth_limit burst=300 nodelay;
            proxy_pass http://app_backend;
            proxy_cache off;
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        # Uncached API routes
        location /api/ {
            proxy_pass http://app_backend;
            proxy_cache off;
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        # Cached public lesson index and details
        location = / {
            proxy_pass http://app_backend;
            proxy_cache page_cache;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        location = /lessons {
            proxy_pass http://app_backend;
            proxy_cache page_cache;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        location /lessons/ {
            proxy_pass http://app_backend;
            proxy_cache page_cache;
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        # General application traffic
        location / {
            proxy_pass http://app_backend;
            add_header X-Served-By $upstream_http_x_served_by always;
        }
    }
}
