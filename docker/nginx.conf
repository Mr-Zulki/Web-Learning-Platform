events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 256k;

    # Custom log format logging upstream IP, latency, and container hostname
    log_format upstream_lb '$time_iso8601 - $remote_addr "$request" status=$status '
                           'upstream=$upstream_addr response_time=${upstream_response_time}s '
                           'served_by="$upstream_http_x_served_by"';

    access_log /dev/stdout upstream_lb;
    error_log /dev/stderr warn;

    # Gzip compression for text and asset responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Coarse rate limit for authentication endpoints (second layer in front of DB limiter)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/m;
    limit_req_status 429;

    # Upstream to app replicas
    upstream app_backend {
        server app:3000 max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Timeouts and failover for passive replica recovery
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        # Default proxy headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; # OVERWRITE, never append
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hide internal upstream software headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Static assets caching with immutable headers
        location /_next/static/ {
            proxy_pass http://app_backend;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        # Rate-limited auth routes
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://app_backend;
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        # General application traffic
        location / {
            proxy_pass http://app_backend;
            add_header X-Served-By $upstream_http_x_served_by always;
        }
    }
}

