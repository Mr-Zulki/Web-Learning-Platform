name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality (Lint, Types, Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Verify formatting (Prettier)
        run: npm run format:check

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with Coverage
        run: npm run test:coverage

  integration-tests:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uni_test
          POSTGRES_USER: uni
          POSTGRES_PASSWORD: uni_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Prisma Migrations
        env:
          DATABASE_URL: postgresql://uni:uni_password@localhost:5432/uni_test?schema=public
        run: npx prisma migrate deploy

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://uni:uni_password@localhost:5432/uni_test?schema=public
          AUTH_SECRET: test_auth_secret_for_ci_environment_testing_only_32_chars
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: test
        run: npm run test:integration

  docker-build-and-e2e:
    name: Container Build & Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Prepare Docker Environment
        run: |
          cp .env.docker.example .env.docker
          sed -i 's/AUTH_SECRET=changeme_generate_a_secure_random_string_min_32_chars/AUTH_SECRET=ci_secure_random_secret_token_32chars_test/' .env.docker
          sed -i 's/POSTGRES_PASSWORD=changeme_in_production/POSTGRES_PASSWORD=ci_postgres_password/' .env.docker
          sed -i 's/DATABASE_URL=postgresql:\/\/uni:changeme_in_production@db:5432\/uni_prod?schema=public/DATABASE_URL=postgresql:\/\/uni:ci_postgres_password@db:5432\/uni_prod?schema=public/' .env.docker

      - name: Build and Start Stack via Docker Compose
        run: |
          docker compose --env-file .env.docker up -d --build --wait --wait-timeout 180

      - name: Verify Stack Health
        run: |
          curl -f http://localhost:8080/api/health
          curl -f http://localhost:8080/api/ready

      - name: Run Playwright E2E Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:8080
          CI: true
        run: npx playwright test

      - name: Teardown Docker Stack
        if: always()
        run: docker compose --env-file .env.docker down -v

  security-audit:
    name: Production Dependencies Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=high
