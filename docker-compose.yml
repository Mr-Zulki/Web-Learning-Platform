services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-uni_dev}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-uni_dev}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal_net

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_prod_password@db:5432/uni_dev?schema=public}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_prod_password@db:5432/uni_dev?schema=public}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:8080}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal_net

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_prod_data:
